<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Anshu </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@300;400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#e04a43;
    --sky-mid:#241b5e;
    --sky-bottom:#4a2f7a;
    --cream:#fff6e9;
    --trunk:#6b4226;
    --trunk-dark:#4e2f1a;
    --leaf-1:#3f7d5c;
    --leaf-2:#2f6349;
    --leaf-3:#559c72;
    --gold:#f0b429;
    --coral:#ff6f5e;
    --pink:#f4739b;
    --teal:#2fc6b0;
    --lilac:#9d7ff0;
    --ink:#2c2140;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
    background:var(--cream);
    color:var(--ink);
  }
  button{font-family:inherit; cursor:pointer;}

  /* ============ INTRO SKY SCENE ============ */
  #intro{
    position:fixed; inset:0;
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    z-index:100;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  #intro.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  .star{
    position:absolute; width:3px; height:3px; background:#fff;
    border-radius:50%; opacity:.6;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.2;} 50%{opacity:.9;} }

  .moon{
    position:absolute; top:8%; right:12%;
    width:70px; height:70px; border-radius:50%;
    background:#fdf3d3;
    box-shadow:0 0 40px 10px rgba(253,243,211,.35);
  }

  .intro-content{
    position:relative; z-index:5;
    text-align:center; color:#fff;
    padding:0 20px;
  }
  .intro-eyebrow{
    font-size:14px; letter-spacing:.3em; text-transform:uppercase;
    color:#c9c1f2; margin-bottom:14px; opacity:.85;
  }
  .intro-title{
    font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:clamp(32px, 7vw, 58px);
    line-height:1.1;
    text-shadow:0 4px 24px rgba(0,0,0,.35);
  }
  .intro-sub{
    font-family:'Caveat',cursive; font-size:clamp(20px,3vw,26px);
    color:#e7e1ff; margin-top:10px;
  }
  #open-btn{
    margin-top:34px;
    background:var(--gold);
    color:#3a2600;
    border:none;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px;
    padding:14px 34px;
    border-radius:100px;
    box-shadow:0 8px 22px rgba(240,180,41,.4);
    animation:pulse 2.2s ease-in-out infinite;
    letter-spacing:.02em;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.05); }
  }
  #open-btn:active{ transform:scale(.96); }

  .balloon-layer{ position:absolute; inset:0; pointer-events:none; }
  .balloon{
    position:absolute;
    bottom:-220px;
    width:60px; height:74px;
    border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    animation-name:rise, sway;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
    opacity:.95;
  }
  .balloon::before{
    content:"";
    position:absolute; left:50%; top:100%;
    width:1px; height:60px;
    background:rgba(255,255,255,.35);
    transform:translateX(-50%);
  }
  .balloon::after{
    content:"";
    position:absolute; left:50%; top:14%;
    width:14px; height:18px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    transform:translate(-70%,-30%) rotate(-25deg);
  }
  @keyframes rise{
    0%{ bottom:-220px; }
    100%{ bottom:112%; }
  }
  @keyframes sway{
    0%,100%{ margin-left:0px; }
    50%{ margin-left:38px; }
  }

  /* ============ MAIN SCENE ============ */
  #main{
    position:relative;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 0%, #fffdf6 0%, var(--cream) 55%),
      var(--cream);
    display:flex; flex-direction:column; align-items:center;
    padding:56px 20px 90px;
    opacity:0;
    transform:translateY(18px);
    transition:opacity 1s ease .15s, transform 1s ease .15s;
  }
  #main.show{ opacity:1; transform:translateY(0); }

  .bunting{
    display:flex; justify-content:center; gap:6px;
    margin-bottom:26px;
  }
  .flag{
    width:26px; height:32px;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    animation:flagsway 2.6s ease-in-out infinite;
    transform-origin:top center;
  }
  .flag:nth-child(odd){ animation-delay:.2s; }
  @keyframes flagsway{ 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }

  .headline-wrap{ text-align:center; margin-bottom:6px; }
  .headline{
    font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:clamp(30px, 6vw, 50px);
    color:var(--ink);
  }
  .headline .accent{ color:var(--coral); }
  .subhead{
    font-family:'Caveat',cursive;
    font-size:clamp(20px,3vw,26px);
    color:#6b6182;
    margin-top:6px;
  }

  /* the tree */
  .tree-stage{
    position:relative;
    width:min(640px, 92vw);
    height:560px;
    margin-top:26px;
  }
  .trunk{
    position:absolute; bottom:0; left:50%;
    width:46px; height:190px;
    background:linear-gradient(to right, var(--trunk-dark), var(--trunk) 40%, var(--trunk-dark));
    border-radius:8px 8px 4px 4px;
    transform:translateX(-50%);
  }
  .trunk::before, .trunk::after{
    content:"";
    position:absolute; bottom:34px;
    width:70px; height:16px;
    background:var(--trunk);
    border-radius:20px;
  }
  .trunk::before{ left:-52px; transform:rotate(18deg); }
  .trunk::after{ right:-52px; transform:rotate(-18deg); }

  .grass{
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    width:340px; height:26px;
    background:radial-gradient(ellipse at center, rgba(85,156,114,.35), transparent 70%);
    border-radius:50%;
  }

  .canopy{
    position:absolute; left:50%; bottom:150px; transform:translateX(-50%);
    width:440px; height:340px;
  }
  .blob{
    position:absolute; border-radius:50%;
  }
  .b1{ width:230px; height:210px; left:20px; top:70px; background:var(--leaf-2); }
  .b2{ width:210px; height:200px; right:10px; top:40px; background:var(--leaf-1); }
  .b3{ width:250px; height:230px; left:105px; top:0; background:var(--leaf-3); }
  .b4{ width:170px; height:160px; left:0; top:150px; background:var(--leaf-1); }
  .b5{ width:180px; height:170px; right:0; top:150px; background:var(--leaf-2); }

  .lights{
    position:absolute; inset:0;
  }
  .light{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 3px rgba(240,180,41,.7);
    animation:twinkle2 1.8s ease-in-out infinite;
  }
  @keyframes twinkle2{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }

  .ornament{
    position:absolute;
    width:78px;
    background:#fff;
    padding:6px 6px 20px;
    border-radius:4px;
    box-shadow:0 10px 20px rgba(44,33,64,.25);
    transform-origin:top center;
    animation:swayOrnament 4s ease-in-out infinite;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, z-index 0.3s ease;
    cursor:pointer;
  }
  .ornament:hover{
    animation-play-state: paused;
    transform: scale(1.22) translateY(4px) !important;
    box-shadow: 0 15px 30px rgba(44,33,64,.4);
    z-index: 100;
  }
  .ornament::before{
    content:"";
    position:absolute; left:50%; top:-30px;
    width:1px; height:30px;
    background:rgba(90,70,50,.5);
    transform:translateX(-50%);
  }
  .ornament .frame{
    width:100%; aspect-ratio:1/1;
    border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    overflow:hidden;
  }
  .ornament .cap{
    display:block; text-align:center;
    font-family:'Caveat',cursive; font-size:14px;
    color:#8a7f9c; margin-top:6px;
  }
  @keyframes swayOrnament{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }

  /* ============ LIGHTBOX MODAL ============ */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  .lightbox.show {
    opacity: 1;
    visibility: visible;
  }
  .lightbox-overlay {
    position: absolute;
    inset: 0;
    background: rgba(44, 33, 64, 0.75);
    backdrop-filter: blur(8px);
  }
  .lightbox-content {
    position: relative;
    z-index: 10;
    width: min(400px, 85vw);
    transform: scale(0.8) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .lightbox.show .lightbox-content {
    transform: scale(1) translateY(0);
  }
  .lightbox-card {
    background: #fff;
    padding: 16px 16px 36px;
    border-radius: 12px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  }
  .lightbox-img-wrap {
    width: 100%;
    aspect-ratio: 1/1;
    overflow: hidden;
    border-radius: 8px;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
  }
  .lightbox-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .lightbox-caption {
    font-family: 'Caveat', cursive;
    font-size: clamp(24px, 5vw, 30px);
    color: var(--ink);
    text-align: center;
    margin-top: 18px;
    line-height: 1.3;
  }
  .lightbox-close {
    position: absolute;
    top: -50px;
    right: 0;
    background: none;
    border: none;
    color: #fff;
    font-size: 38px;
    line-height: 1;
    padding: 10px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .lightbox-close:hover {
    transform: scale(1.2);
  }

  .confetti{
    position:absolute; top:-20px;
    width:8px; height:14px;
    opacity:.9;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(620px) rotate(340deg); opacity:0; }
  }

  .note{
    max-width:520px; text-align:center;
    margin-top:34px;
    font-size:16px; line-height:1.7; color:#584f6e;
  }
  .note strong{ color:var(--ink); }

  .footer-note{
    margin-top:26px;
    font-family:'Caveat',cursive; font-size:20px; color:#9086a3;
  }

  @media (max-width:480px){
    .tree-stage{ height:480px; }
    .canopy{ width:340px; height:270px; bottom:130px; }
    .b1{width:180px;height:170px;left:10px;top:60px;}
    .b2{width:170px;height:160px;right:0;top:30px;}
    .b3{width:200px;height:190px;left:75px;top:0;}
    .b4{width:130px;height:120px;top:120px;}
    .b5{width:140px;height:130px;top:120px;}
    .ornament{ width:60px; padding:5px 5px 14px; }
    .ornament .frame{ font-size:20px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>

<!-- ================= INTRO ================= -->
<div id="intro">
  <div id="stars"></div>
  <div class="moon"></div>
  <div class="balloon-layer" id="balloonLayer"></div>
  <div class="intro-content">
    <div class="intro-eyebrow">a little something for you</div>
    <div class="intro-title">Make a wish...</div>
    <div class="intro-sub">the sky's getting crowded with balloons</div>
    <button id="open-btn">Open your birthday page</button>
  </div>
</div>

<!-- ================= MAIN SCENE ================= -->
<div id="main">
  <div class="bunting" id="bunting"></div>

  <div class="headline-wrap">
    <div class="headline">Happy <span class="accent">Birthday</span></div>
    <div class="subhead">every branch holds a memory</div>
  </div>

  <div class="tree-stage" id="treeStage">
    <div class="grass"></div>
    <div class="trunk"></div>
    <div class="canopy">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
      <div class="blob b5"></div>
      <div class="lights" id="lights"></div>
    </div>
    <div id="ornaments"></div>
    <div id="confettiLayer"></div>
  </div>

  <div class="note">
    <strong>Wishing you a year</strong> as bright as these lights and as full
    as this little tree &mdash; here's to more memories worth hanging up.
  </div>
  <div class="footer-note">tap the tree to sprinkle a little more confetti ✧</div>
</div>

<!-- ================= LIGHTBOX MODAL ================= -->
<div id="lightbox" class="lightbox">
  <div class="lightbox-overlay" id="lightbox-overlay"></div>
  <div class="lightbox-content">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <div class="lightbox-card">
      <div class="lightbox-img-wrap" id="lightbox-img-wrap">
        <!-- Image or emoji dynamically injected -->
      </div>
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>
</div>

<script>
// ---------- stars ----------
const starsEl = document.getElementById('stars');
for(let i=0;i<70;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*70+'%';
  s.style.animationDelay = (Math.random()*3)+'s';
  starsEl.appendChild(s);
}

// ---------- rising balloons ----------
const balloonColors = ['#ff6f5e','#f4739b','#2fc6b0','#f0b429','#9d7ff0','#ff9f6b'];
const layer = document.getElementById('balloonLayer');
function spawnBalloon(){
  const b = document.createElement('div');
  b.className='balloon';
  const color = balloonColors[Math.floor(Math.random()*balloonColors.length)];
  b.style.background = `radial-gradient(circle at 32% 28%, ${color}dd, ${color})`;
  const left = Math.random()*94;
  const riseDur = 7 + Math.random()*5;
  const swayDur = 2.4 + Math.random()*1.6;
  const size = 46 + Math.random()*30;
  b.style.left = left+'vw';
  b.style.width = size+'px';
  b.style.height = (size*1.22)+'px';
  b.style.animationDuration = riseDur+'s, '+swayDur+'s';
  b.style.animationDelay = '0s, '+(Math.random()*swayDur)+'s';
  layer.appendChild(b);
  setTimeout(()=> b.remove(), riseDur*1000+200);
}
let spawnTimer = setInterval(spawnBalloon, 380);
for(let i=0;i<10;i++) setTimeout(spawnBalloon, i*180);

// ---------- open transition ----------
const intro = document.getElementById('intro');
const main = document.getElementById('main');
let opened = false;
function openSite(){
  if(opened) return;
  opened = true;
  intro.classList.add('hide');
  clearInterval(spawnTimer);
  document.body.style.overflowY='auto';
  setTimeout(()=>{
    main.classList.add('show');
  }, 250);
}
document.getElementById('open-btn').addEventListener('click', openSite);
setTimeout(openSite, 8000); // auto-open if they just watch

// ---------- bunting flags ----------
const buntingColors = ['#ff6f5e','#f0b429','#2fc6b0','#f4739b','#9d7ff0','#ff6f5e','#f0b429','#2fc6b0','#f4739b'];
const buntingEl = document.getElementById('bunting');
buntingColors.forEach((c,i)=>{
  const f = document.createElement('div');
  f.className='flag';
  f.style.background = c;
  f.style.animationDelay = (i*0.15)+'s';
  buntingEl.appendChild(f);
});

// ---------- fairy lights on canopy ----------
const lightsEl = document.getElementById('lights');
for(let i=0;i<24;i++){
  const l = document.createElement('div');
  l.className='light';
  l.style.left = (Math.random()*90+5)+'%';
  l.style.top = (Math.random()*85+5)+'%';
  l.style.animationDelay = (Math.random()*1.8)+'s';
  lightsEl.appendChild(l);
}

// ---------- photo ornaments ----------
const ornaments = [
  { img:'pic4.jpg', emoji:'👩‍👦', caption:'smiles', pos:{left:'8%',  top:'6%'}, message: 'Your smile makes everything brighter! 💖' },
  { img:'', emoji:'🎈', caption:'balloons', pos:{left:'62%', top:'2%'}, message: 'May your dreams fly as high as these balloons! 🎈' },
  { img:'pic2.jpg', emoji:'👟', caption:'walking', pos:{left:'28%', top:'20%'}, message: "Here's to walking hand in hand, always 👣" },
  { img:'', emoji:'✨', caption:'sparkle',  pos:{left:'50%', top:'14%'}, message: 'You shine brighter than all these lights combined! 🌟' },
  { img:'pic1.jpg', emoji:'🌸', caption:'flower', pos:{left:'12%', top:'32%'}, message: 'A beautiful flower in your hair, a beautiful soul within 🌺' },
  { img:'pic3.jpg', emoji:'💍', caption:'promise', pos:{left:'70%', top:'24%'}, message: 'A promise of laughter and endless joy 🌸' },
  { img:'pic5.jpg', emoji:'❤️', caption:'moments', pos:{left:'40%', top:'34%'}, message: 'The sweetest memories are made with you 💕' },
  { img:'', emoji:'⭐', caption:'wish',     pos:{left:'80%', top:'12%'}, message: 'Wishing you the happiest year ahead! Make a wish! 🎂' },
];
const bgTints = ['#ffe9e4','#fff2d6','#e3f8f1','#fde5ee','#efe8ff','#e4f3ff'];
const ornEl = document.getElementById('ornaments');
ornaments.forEach((o,i)=>{
  const el = document.createElement('div');
  el.className='ornament';
  el.style.left = o.pos.left;
  el.style.top = o.pos.top;
  el.style.animationDelay = (i*0.25)+'s';
  el.style.animationDuration = (3.4 + (i%3)*0.5)+'s';
  const tint = bgTints[i % bgTints.length];
  el.innerHTML = `
    <div class="frame" style="background:${tint}">
      ${o.img ? `<img src="${o.img}" alt="${o.caption}" style="width:100%;height:100%;object-fit:cover;">` : o.emoji}
    </div>
    <span class="cap">${o.caption}</span>
  `;
  
  // Open lightbox on click
  el.addEventListener('click', (e) => {
    e.stopPropagation(); // prevent confetti burst from triggering on the background stage
    openLightbox(o);
  });
  
  ornEl.appendChild(el);
});

// ---------- lightbox logic ----------
const lightbox = document.getElementById('lightbox');
const lightboxImgWrap = document.getElementById('lightbox-img-wrap');
const lightboxCaption = document.getElementById('lightbox-caption');

function openLightbox(o) {
  if (o.img) {
    lightboxImgWrap.innerHTML = `<img src="${o.img}" alt="${o.caption}">`;
  } else {
    lightboxImgWrap.innerHTML = o.emoji;
  }
  lightboxCaption.textContent = o.message || o.caption;
  lightbox.classList.add('show');
}

function closeLightbox() {
  lightbox.classList.remove('show');
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-overlay').addEventListener('click', closeLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});

// ---------- confetti on tap ----------
const stage = document.getElementById('treeStage');
const confettiLayer = document.getElementById('confettiLayer');
const confettiColors = ['#ff6f5e','#f0b429','#2fc6b0','#f4739b','#9d7ff0'];
function burstConfetti(x){
  for(let i=0;i<26;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.style.left = (x + (Math.random()*60-30)) + 'px';
    c.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
    c.style.animationDuration = (1.4+Math.random()*1.2)+'s';
    confettiLayer.appendChild(c);
    setTimeout(()=>c.remove(), 2800);
  }
}
stage.addEventListener('click', (e)=>{
  const rect = stage.getBoundingClientRect();
  burstConfetti(e.clientX - rect.left);
});
</script>
</body>
</html>
